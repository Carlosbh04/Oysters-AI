    <!-- ============================================================
         LA FUENTE, EN CASA

         Antes: dos preconnect y una hoja bloqueante de
         fonts.googleapis.com que a su vez pedía los woff2 a
         fonts.gstatic.com — dos orígenes externos (DNS+TLS cada
         uno) plantados en medio del camino crítico. Y la intro
         ESPERA a document.fonts.ready, así que en conexiones
         lentas esa cadena retrasaba el primer pintado o forzaba
         el vigilante de 2,5s (que arranca la intro con la fuente
         de reserva y el texto sale deforme — el defecto está
         descrito en IntroAnimation.jsx).

         Ahora: los DOS woff2 exactos que servía Google (Outfit
         variable v15, latin y latin-ext, 48K entre ambos) viven
         en /fonts, y sus @font-face van INLINE aquí — cero
         peticiones bloqueantes, cero orígenes externos, mismo
         archivo de fuente, mismo font-display: swap. El render
         es idéntico glifo a glifo.

         El preload adelanta el latin (el que usa todo el texto
         del sitio); el latin-ext solo se descarga si algún
         carácter lo pide, igual que antes. -->
    <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
